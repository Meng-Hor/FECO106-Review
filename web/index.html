<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FECO106 Mid-Term Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="bg-[#FDE8D0]/90 backdrop-blur-xl border-b border-[#F0D5B5] sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-lg overflow-hidden flex items-center justify-center shadow-sm border border-orange-200/50 bg-white/50 group-hover:bg-white/80 transition-colors">
                    <img src="dog_icon.png" alt="Dog Icon" class="w-full h-full object-cover">
                </div>
                <span class="font-outfit font-bold text-xl text-gray-800 tracking-tight">FECO106</span>
            </a>
            <div class="flex space-x-6">
                <a href="index.html" class="text-gray-600 hover:text-orange-600 font-medium transition-colors flex items-center"><i class="fa-solid fa-house mr-2 text-sm"></i> Home</a>
                <a href="index.html#dashboard" class="text-gray-600 hover:text-orange-600 font-medium transition-colors flex items-center"><i class="fa-solid fa-layer-group mr-2 text-sm"></i> Quizzes</a>
                <a href="index.html#pdf-container" class="text-gray-600 hover:text-orange-600 font-medium transition-colors flex items-center"><i class="fa-solid fa-file-pdf mr-2 text-sm"></i> Materials</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8 relative z-10">
        

        <!-- Dashboard View -->
        <div id="dashboard" class="card-container p-6">
            <h2 class="text-2xl font-semibold mb-6 text-gray-800"><i class="fa-solid fa-layer-group mr-3"></i>Available Quiz Sets</h2>
            <div id="quiz-sets-container" class="grid gap-4 md:grid-cols-2 mb-8">
                <!-- Dynamically populated -->
            </div>
            
            <h2 class="text-2xl font-semibold mb-6 text-gray-800 mt-10"><i class="fa-solid fa-book-open mr-3"></i>Study Materials (PDFs)</h2>
            <div id="pdf-container" class="grid gap-4 md:grid-cols-2">
                <!-- Dynamically populated -->
            </div>
        </div>


        </div>
    <script>
        window.quizData = [];
    </script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_1_Core_Concepts/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_2_State_Tracing/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_3_Defect_Diagnosis/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_4_Failure_and_Testing/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_5_Integrated_Review/data.js"></script>
    <script src="sets/PDF_Set_1_follow-ups_Core_concepts/data.js"></script>
    <script src="sets/PDF_Set_2_follow-ups_State_tracing/data.js"></script>
    <script src="sets/PDF_Set_3_follow-ups_Defect_diagnosis/data.js"></script>
    <script src="sets/PDF_Set_4_follow-ups_Failure_and_testing/data.js"></script>
    <script src="sets/PDF_Set_5_follow-ups_Integrated_review/data.js"></script>
    <script src="sets/Revision_Exercise_1/data.js"></script>
    <script src="sets/Revision_Exercise_2/data.js"></script>
        </div>
    <script>
    const pdfData = [{"name": "Algorithm_III_Week_1_Lesson_Plan.pdf", "path": "../material/Algorithm_III_Week_1_Lesson_Plan.pdf"}, {"name": "Algorithm_III_Week_2_Lesson_Plan.pdf", "path": "../material/Algorithm_III_Week_2_Lesson_Plan.pdf"}, {"name": "Algorithm_III_Week_3_Lesson_Plan.pdf", "path": "../material/Algorithm_III_Week_3_Lesson_Plan.pdf"}, {"name": "Revision Exercise 1.pdf", "path": "../material/Revision Exercise 1.pdf"}, {"name": "Revision Exercise 2.pdf", "path": "../material/Revision Exercise 2.pdf"}, {"name": "Set 1 follow-ups_ Core concepts.pdf", "path": "../material/Set 1 follow-ups_ Core concepts.pdf"}];

        const quizData = window.quizData;
        const quizView = document.getElementById('quiz-view');
        const resultView = document.getElementById('result-view');
        const setsContainer = document.getElementById('quiz-sets-container');
        const pdfContainer = document.getElementById('pdf-container');
        
        const setTitle = document.getElementById('current-set-title');
        const qNum = document.getElementById('current-question-num');
        const totalQ = document.getElementById('total-questions');
                const timeEl = document.getElementById('time-left');
        const qText = document.getElementById('question-text');
        
        const optionsContainer = document.getElementById('options-container');
        const openEndedContainer = document.getElementById('open-ended-container');
        const oeAnswer = document.getElementById('open-ended-answer');
        const revealBtn = document.getElementById('reveal-btn');
        const answerFeedback = document.getElementById('answer-feedback');
        const modelAnswerText = document.getElementById('model-answer-text');
        
        const nextBtn = document.getElementById('next-btn');
        const quitBtn = document.getElementById('quit-btn');
        
        function initDashboard() {
            setsContainer.innerHTML = '';

            pdfContainer.innerHTML = '';
            if (pdfData.length === 0) {
                pdfContainer.innerHTML = '<p class="text-gray-500">No PDF materials found.</p>';
            } else {
                pdfData.forEach((pdf) => {
                    const link = document.createElement('a');
                    link.href = encodeURI(pdf.path);
                    link.target = '_blank';
                    link.className = 'btn-secondary p-6 text-left group flex items-center justify-between';
                    link.innerHTML = `
                        <div class="flex items-center min-w-0 flex-1"><i class="fa-solid fa-file-pdf text-red-500 mr-3 text-xl flex-shrink-0"></i><h3 class="text-lg font-bold text-gray-800 group-hover:text-red-600 truncate mr-4">${pdf.name}</h3></div>
                        <i class="fa-solid fa-download text-gray-400 group-hover:text-red-500 transition-colors flex-shrink-0 ml-2"></i>`;
                    pdfContainer.appendChild(link);
                });
            }

            quizData.forEach((set, index) => {
                const btn = document.createElement('button');
                const cleanName = set.set.replace(/_/g, ' ');
                btn.className = 'btn-secondary p-6 text-left group';
                btn.innerHTML = `
                        ${set.set.includes("PDF_") ? 
                            '<i class="fa-solid fa-pen-to-square text-orange-600 mb-3  text-2xl group-hover:scale-110 transition-transform"></i>' : 
                            (set.set.includes("Revision") ? 
                                '<i class="fa-solid fa-book text-orange-600 mb-3  text-2xl group-hover:scale-110 transition-transform"></i>' :
                                '<i class="fa-solid fa-list-check text-orange-600 mb-3  text-2xl group-hover:scale-110 transition-transform"></i>'
                            )
                        }
                        <h3 class="text-lg font-bold text-gray-800 group-hover:text-orange-600 mb-2 truncate">${cleanName}</h3>
                        <p class="text-sm text-gray-500">${set.questions.length} Questions</p>`;
                btn.onclick = () => startQuiz(index);
                setsContainer.appendChild(btn);
            });
        }
        
        function startQuiz(index) {
            window.location.href = 'quiz.html?set=' + index;
        }

        window.addEventListener('DOMContentLoaded', initDashboard);


        
    </script>
</body>
</html>
