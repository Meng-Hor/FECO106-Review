  <script>
  const pdfData = [{"name": "Algorithm_III_Week_1_Lesson_Plan.pdf", "path": "../material/Algorithm_III_Week_1_Lesson_Plan.pdf"}, {"name": "Algorithm_III_Week_2_Lesson_Plan.pdf", "path": "../material/Algorithm_III_Week_2_Lesson_Plan.pdf"}, {"name": "Algorithm_III_Week_3_Lesson_Plan.pdf", "path": "../material/Algorithm_III_Week_3_Lesson_Plan.pdf"}, {"name": "Revision Exercise 1.pdf", "path": "../material/Revision Exercise 1.pdf"}, {"name": "Revision Exercise 2.pdf", "path": "../material/Revision Exercise 2.pdf"}, {"name": "Set 1 follow-ups_ Core concepts.pdf", "path": "../material/Set 1 follow-ups_ Core concepts.pdf"}];

    const quizData = window.quizData;
    const setsContainer = document.getElementById('quiz-sets-container');
    const pdfContainer = document.getElementById('pdf-container');
    
    function initDashboard() {
      setsContainer.innerHTML = '';

      pdfContainer.innerHTML = '';
      if (pdfData.length === 0) {
        pdfContainer.innerHTML = '<p class="text-gray-500">No PDF materials found.</p>';
      } else {
        pdfData.forEach((pdf) => {
          const link = document.createElement('a');
          link.href = encodeURI(pdf.path);
          link.target = '_blank';
          link.className = 'btn-secondary p-5 sm:p-6 text-left group flex items-center justify-between relative overflow-hidden';
          link.innerHTML = `
            <div class="flex items-center min-w-0 flex-1"><i class="fa-solid fa-file-pdf text-theme-danger mr-3 text-2xl flex-shrink-0"></i><h3 class="text-lg font-bold truncate mr-4 " style="color: var(--text-main)">${pdf.name}</h3></div>
            <div class="w-10 h-10 rounded-full flex items-center justify-center transition-all " style="background: var(--nav-bg); border: 1px solid var(--glass-border)"><i class="fa-solid fa-download" style="color: var(--danger-color)"></i></div>`;
          pdfContainer.appendChild(link);
        });
      }

      quizData.forEach((set, index) => {
        const btn = document.createElement('button');
        const cleanName = set.set.replace(/_/g, ' ');
        btn.className = 'btn-secondary p-5 sm:p-6 text-left group flex flex-col justify-between h-full min-h-[140px] relative overflow-hidden';
        btn.innerHTML = `
            ${set.set.includes("PDF_") ? 
              '<i class="fa-solid fa-pen-to-square text-theme-primary mb-3 text-2xl "></i>' : 
              (set.set.includes("Revision") ? 
                '<i class="fa-solid fa-book text-theme-primary mb-3 text-2xl "></i>' :
                '<i class="fa-solid fa-list-check text-theme-primary mb-3 text-2xl "></i>'
              )
            }
            <h3 class="text-lg font-bold mb-2 truncate " style="color: var(--text-main)">${cleanName}</h3>
            <p class="text-sm font-medium flex items-center gap-2" style="color: var(--text-muted)"><i class="fa-solid fa-clipboard-question opacity-70"></i> ${set.questions.length} Questions</p>`;
        btn.onclick = () => startQuiz(index);
        setsContainer.appendChild(btn);
      });
    }
    
    function startQuiz(index) {
      window.location.href = 'quiz.html?set=' + index;
    }

    window.addEventListener('DOMContentLoaded', initDashboard);


    
  </script>

  <script>
    // Theme & Mode Logic
    const themeSelector = document.getElementById('theme-selector');
    const modeToggle = document.getElementById('mode-toggle');
    const modeIcon = document.getElementById('mode-icon');
    
    // Load saved theme
    const savedTheme = localStorage.getItem('selectedTheme') || 'aura';
    document.documentElement.setAttribute('data-theme', savedTheme);
    if (themeSelector) themeSelector.value = savedTheme;

    // Load saved mode or default strictly to light
    let currentMode = localStorage.getItem('colorMode') || 'light';
    document.documentElement.setAttribute('data-color-mode', currentMode);
    updateModeIcon();

    // Listen for Theme changes
    if (themeSelector) {
      themeSelector.addEventListener('change', (e) => {
        const newTheme = e.target.value;
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('selectedTheme', newTheme);
      });
    }
    
    // Listen for Mode changes
    if (modeToggle) {
      modeToggle.addEventListener('click', () => {
        currentMode = currentMode === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-color-mode', currentMode);
        localStorage.setItem('colorMode', currentMode);
        updateModeIcon();
      });
    }

    function updateModeIcon() {
      if (modeIcon) {
        if (currentMode === 'dark') {
          modeIcon.className = 'fa-solid fa-sun';
        } else {
          modeIcon.className = 'fa-solid fa-moon';
        }
      }
    }
  </script>

  <script>
    // Smart Header Logic - 300px Threshold & Top Hover Reveal
    let lastScrollY = window.scrollY;
    let scrollUpDistance = 0;
    let ticking = false;
    let isHoveringTop = false;
    
    const header = document.getElementById('smart-header');
    
    function showHeader() {
      header.style.transform = 'translateY(0)';
      header.style.opacity = '1';
      header.style.pointerEvents = 'auto';
    }

    function hideHeader() {
      if (window.scrollY > 100 && !isHoveringTop) {
        header.style.transform = 'translateY(-120%)';
        header.style.opacity = '0';
        header.style.pointerEvents = 'none';
      }
    }

    // 1. Mouse hover logic for desktop
    document.addEventListener('mousemove', (e) => {
      if (e.clientY < 90) {
        if (!isHoveringTop) {
          isHoveringTop = true;
          showHeader();
        }
      } else {
        if (isHoveringTop) {
          isHoveringTop = false;
          // Hide if we move mouse away, UNLESS we earned the header by scrolling up 300px
          if (scrollUpDistance < 300 && window.scrollY > 100) {
            hideHeader();
          }
        }
      }
    });

    // 2. Scroll logic
    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          const currentScrollY = window.scrollY;
          const scrollDelta = currentScrollY - lastScrollY;
          
          if (scrollDelta > 0) {
            // Scrolling DOWN
            scrollUpDistance = 0; // Reset up-scroll counter
            hideHeader();
          } else if (scrollDelta < 0) {
            // Scrolling UP
            scrollUpDistance += Math.abs(scrollDelta);
            
            // Reveal if scrolled up intentionally by 300px, or near top
            if (scrollUpDistance > 300 || currentScrollY < 100) {
              showHeader();
            }
          }
          
          lastScrollY = currentScrollY;
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });
  </script>
