<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FECO106 Mid-Term Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="bg-[#FDE8D0]/90 backdrop-blur-xl border-b border-[#F0D5B5] sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-lg overflow-hidden flex items-center justify-center shadow-sm border border-orange-200/50 bg-white/50 group-hover:bg-white/80 transition-colors">
                    <img src="dog_icon.png" alt="Dog Icon" class="w-full h-full object-cover">
                </div>
                <span class="font-outfit font-bold text-xl text-gray-800 tracking-tight">FECO106</span>
            </a>
            <div class="flex space-x-6">
                <a href="index.html" class="text-gray-600 hover:text-orange-600 font-medium transition-colors flex items-center"><i class="fa-solid fa-house mr-2 text-sm"></i> Home</a>
                <a href="index.html#dashboard" class="text-gray-600 hover:text-orange-600 font-medium transition-colors flex items-center"><i class="fa-solid fa-layer-group mr-2 text-sm"></i> Quizzes</a>
                <a href="index.html#pdf-container" class="text-gray-600 hover:text-orange-600 font-medium transition-colors flex items-center"><i class="fa-solid fa-file-pdf mr-2 text-sm"></i> Materials</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8 relative z-10">
        

        <!-- Quiz View -->
        <div id="quiz-view" class="hidden">
            <div class="card-container p-6 mb-6 relative">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <div>
                        <h3 id="current-set-title" class="text-xl font-bold text-gray-800 mb-1 font-outfit">Set Title</h3>
                        <p class="text-sm text-gray-500">Question <span id="current-question-num">1</span> of <span id="total-questions">10</span></p>
                    </div>
                    <div class="flex items-center gap-4">
                        
                        <div class="w-16 h-16 rounded-full border-4 border-blue-500 flex items-center justify-center relative transition-colors duration-300">
                            <span id="time-left" class="text-xl font-bold">20</span>
                        </div>
                    </div>
                </div>

                <div class="mb-8">
                    <h2 id="question-text" class="text-2xl font-semibold mb-6 text-gray-800">Question text goes here?</h2>
                    
                    <div id="options-container" class="grid gap-4">
                        <!-- Options generated here -->
                    </div>
                    
                    <div id="open-ended-container" class="hidden">
                        <textarea id="open-ended-answer" rows="4" class="w-full p-4 border rounded-lg focus:ring-2 focus:ring-blue-500 mb-4" placeholder="Type your answer here..."></textarea>
                        <button id="reveal-btn" class="btn-primary w-full"><i class="fa-solid fa-paper-plane mr-2"></i>Submit Answer</button>
                        
                        <div id="answer-feedback" class="hidden mt-6 p-4 bg-white/40 backdrop-blur-lg border border-gray-200/50 border rounded-lg">
                            <h4 class="font-bold text-gray-700 mb-2">Model Answer:</h4>
                            <p id="model-answer-text" class="text-gray-600 mb-4"></p>
                            <div class="flex gap-4 justify-center">
                                <button id="self-correct-btn" class="px-6 py-2 btn-primary bg-green-500 px-6 py-2"><i class="fa-solid fa-check mr-2"></i>I Got It Right</button>
                                <button id="self-wrong-btn" class="px-6 py-2 btn-primary bg-red-500 px-6 py-2"><i class="fa-solid fa-xmark mr-2"></i>I Got It Wrong</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center mt-8 border-t pt-4">
                    <button id="quit-btn" class="px-4 py-2 btn-danger px-4 py-2"><i class="fa-solid fa-xmark mr-2"></i>Quit Quiz</button>
                    <button id="next-btn" class="btn-primary hidden">Next Question <i class="fa-solid fa-arrow-right ml-2"></i></button>
                </div>
            </div>
        </div>


        <!-- Result View -->
        <div id="result-view" class="hidden card-container p-8 text-center">
            <img src="quiz_complete.png" alt="Quiz Complete Celebration" class="w-48 h-auto mx-auto mb-6 drop-shadow-md rounded-2xl">
            <h2 class="text-3xl font-bold mb-4 text-gray-800">Quiz Completed!</h2>
            
            
            <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mb-8">
                <div class="bg-green-100 p-4 rounded-lg border border-green-200">
                    <p class="text-green-800 text-sm font-medium">Correct</p>
                    <p id="correct-count" class="text-3xl font-bold text-green-700">0</p>
                </div>
                <div class="bg-red-100 p-4 rounded-lg border border-red-200">
                    <p class="text-red-800 text-sm font-medium">Incorrect</p>
                    <p id="incorrect-count" class="text-3xl font-bold text-red-700">0</p>
                </div>
            </div>

            <button id="home-btn" class="btn-primary w-full max-w-sm mx-auto"><i class="fa-solid fa-house mr-2"></i>Back to Dashboard</button>
        </div>
    </div>

        </div>
    <script>
        window.quizData = [];
    </script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_1_Core_Concepts/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_2_State_Tracing/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_3_Defect_Diagnosis/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_4_Failure_and_Testing/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_5_Integrated_Review/data.js"></script>
    <script src="sets/PDF_Set_1_follow-ups_Core_concepts/data.js"></script>
    <script src="sets/PDF_Set_2_follow-ups_State_tracing/data.js"></script>
    <script src="sets/PDF_Set_3_follow-ups_Defect_diagnosis/data.js"></script>
    <script src="sets/PDF_Set_4_follow-ups_Failure_and_testing/data.js"></script>
    <script src="sets/PDF_Set_5_follow-ups_Integrated_review/data.js"></script>
    <script src="sets/Revision_Exercise_1/data.js"></script>
    <script src="sets/Revision_Exercise_2/data.js"></script>
        </div>
    <script>
    const pdfData = [{"name": "Revision Exercise 1.pdf", "path": "../material/Revision Exercise 1.pdf"}, {"name": "Revision Exercise 2.pdf", "path": "../material/Revision Exercise 2.pdf"}, {"name": "Set 1 follow-ups_ Core concepts.pdf", "path": "../material/Set 1 follow-ups_ Core concepts.pdf"}];

        const quizData = window.quizData;
        let currentSetIndex = -1;
        let currentQuestionIndex = 0;
        let score = 0;
        let correctAnswers = 0;
        let timer;
        let timeLeft = 0;
        let isAnswered = false;
        
        let dashboard = null;
        const quizView = document.getElementById('quiz-view');
        const resultView = document.getElementById('result-view');
        
        
        
        const setTitle = document.getElementById('current-set-title');
        const qNum = document.getElementById('current-question-num');
        const totalQ = document.getElementById('total-questions');
                const timeEl = document.getElementById('time-left');
        const qText = document.getElementById('question-text');
        
        const optionsContainer = document.getElementById('options-container');
        const openEndedContainer = document.getElementById('open-ended-container');
        const oeAnswer = document.getElementById('open-ended-answer');
        const revealBtn = document.getElementById('reveal-btn');
        const answerFeedback = document.getElementById('answer-feedback');
        const modelAnswerText = document.getElementById('model-answer-text');
        
        const nextBtn = document.getElementById('next-btn');
        const quitBtn = document.getElementById('quit-btn');
        
        
        
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }





                window.addEventListener('DOMContentLoaded', () => {
        const quitBtnObj = document.getElementById('quit-btn');
        const quitModal = document.getElementById('quit-modal');
        const confirmQuitBtn = document.getElementById('confirm-quit-btn');
        const cancelQuitBtn = document.getElementById('cancel-quit-btn');
        
        if (quitBtnObj && quitModal) {
// Intercept Navbar links to show Quit Modal
        const navLinks = document.querySelectorAll('nav a');
        navLinks.forEach(link => {
            link.onclick = (e) => {
                e.preventDefault();
                const targetHref = link.getAttribute('href');
                clearInterval(timer);
                quitModal.classList.remove('hidden');
                
                // Temporarily override the confirm button to go to their clicked nav link
                confirmQuitBtn.onclick = () => {
                    window.location.href = targetHref;
                };
            };
        });
        
        // Reset confirm button behavior for the regular Quit Quiz button
        if (quitBtnObj) {
            quitBtnObj.onclick = () => {
                clearInterval(timer);
                quitModal.classList.remove('hidden');
                
                confirmQuitBtn.onclick = () => {
                    window.location.href = 'index.html';
                };
            };
        }
            
            confirmQuitBtn.onclick = () => {
                window.location.href = 'index.html';
            };
            
            cancelQuitBtn.onclick = () => {
                quitModal.classList.add('hidden');
                if(!isAnswered) timer = setInterval(updateTimer, 1000);
            };
        }

            const params = new URLSearchParams(window.location.search);
            const setIndex = params.get('set');
            
            if (setIndex !== null && quizData[setIndex]) {
                dashboard = { classList: { add: ()=>{}, remove: ()=>{} } };
                startQuiz(parseInt(setIndex));
            } else {
                window.location.href = 'index.html'; // Redirect back if no valid set
            }
        });
function startQuiz(index) {
            currentSetIndex = index;
            currentQuestionIndex = 0;
            score = 0;
            correctAnswers = 0;
            
            resultView.classList.add('hidden');
            quizView.classList.remove('hidden');
            
            
            setTitle.textContent = quizData[currentSetIndex].set.replace(/_/g, ' ');

            totalQ.textContent = quizData[currentSetIndex].questions.length;
            
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            isAnswered = false;
            
            qNum.textContent = currentQuestionIndex + 1;
            
            qText.innerHTML = q.question;
            
            timeLeft = parseInt(q.timeLimit) || 30;
            timeEl.textContent = timeLeft;
            timeEl.parentElement.classList.remove('border-red-500');
            timeEl.parentElement.classList.add('border-blue-500');
            
            clearInterval(timer);
            timer = setInterval(updateTimer, 1000);
            
            if (q.type === 'open_ended') {
                optionsContainer.classList.add('hidden');
                openEndedContainer.classList.remove('hidden');
                oeAnswer.value = '';
                oeAnswer.disabled = false;
                revealBtn.classList.remove('hidden');
                answerFeedback.classList.add('hidden');
            } else {
                openEndedContainer.classList.add('hidden');
                optionsContainer.classList.remove('hidden');
                optionsContainer.innerHTML = '';
                const borderClasses = ['opt-1', 'opt-2', 'opt-3', 'opt-4'];
                
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `option-btn w-full p-4 text-left border rounded-lg bg-white/40 backdrop-blur-lg border border-gray-200/50 hover:bg-white/60 font-medium ${borderClasses[idx]}`;
                    btn.innerHTML = `<span class="mr-3 font-bold text-gray-800 bg-white px-3 py-1 rounded-md shadow-sm border border-gray-200 text-gray-700 backdrop-blur-sm">${idx + 1}</span> ${escapeHtml(opt)}`;
                    btn.onclick = () => selectOption(idx + 1, btn);
                    optionsContainer.appendChild(btn);
                });
            }
            
            nextBtn.classList.add('hidden');
        }
        
        function updateTimer() {
            timeLeft--;
            timeEl.textContent = timeLeft;
            
            if (timeLeft <= 5) {
                timeEl.parentElement.classList.remove('border-blue-500');
                timeEl.parentElement.classList.add('border-red-500');
            }
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                if (quizData[currentSetIndex].questions[currentQuestionIndex].type === 'open_ended') {
                    showModelAnswer();
                } else {
                    timeOutMCQ();
                }
            }
        }

        // Open Ended Logic
        revealBtn.onclick = () => {
            clearInterval(timer);
            showModelAnswer();
        };

        function showModelAnswer() {
            isAnswered = true;
            oeAnswer.disabled = true;
            revealBtn.classList.add('hidden');
            
            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            modelAnswerText.textContent = q.correctAnswer;
            answerFeedback.classList.remove('hidden');
        }

        document.getElementById('self-correct-btn').onclick = () => {
            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            correctAnswers++;
            
            answerFeedback.classList.add('hidden');
            nextBtn.click();
        };

        document.getElementById('self-wrong-btn').onclick = () => {
            answerFeedback.classList.add('hidden');
            nextBtn.click();
        };
        
        // MCQ Logic
        function timeOutMCQ() {
            if (isAnswered) return;
            isAnswered = true;
            
            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            const correctIdx = q.correctOption - 1;
            
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === correctIdx) {
                    buttons[i].classList.add('correct');
                } else {
                    buttons[i].classList.add('opacity-50');
                }
            }
            
            nextBtn.classList.remove('hidden');
        }
        
        function selectOption(selectedOpt, btnElement) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timer);
            
            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            const correctOpt = q.correctOption;
                        
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i + 1 === correctOpt) {
                    buttons[i].classList.add('correct');
                } else {
                    buttons[i].classList.add('opacity-50');
                }
            }
            
            if (selectedOpt === correctOpt) {
                correctAnswers++;
            } else {
                btnElement.classList.remove('opacity-50');
                btnElement.classList.add('incorrect');
            }
            
            nextBtn.classList.remove('hidden');
        }
        
        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData[currentSetIndex].questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };
        
        
        
        function showResults() {
            quizView.classList.add('hidden');
            resultView.classList.remove('hidden');
            
            
            document.getElementById('correct-count').textContent = correctAnswers;
            const total = quizData[currentSetIndex].questions.length;
            document.getElementById('incorrect-count').textContent = total - correctAnswers;
        }
        
        
        
        document.getElementById('home-btn').onclick = () => window.location.href = 'index.html';
        
        

        // --- KEYBOARD INTERACTIVITY ---
        document.addEventListener('keydown', (e) => {
            // Ignore if we are in the dashboard or result view
            if (quizView.classList.contains('hidden')) return;

            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            const isTyping = document.activeElement === oeAnswer;

            if (!isAnswered) {
                if (q.type === 'open_ended') {
                    // Submit Answer
                    if (isTyping && e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        revealBtn.click();
                    }
                } else {
                    // MCQ Selection
                    if (['1', '2', '3', '4'].includes(e.key)) {
                        e.preventDefault();
                        const idx = parseInt(e.key) - 1;
                        const btns = optionsContainer.querySelectorAll('.option-btn');
                        if (btns[idx]) btns[idx].click();
                    }
                }
            } else {
                // Answered State
                if (q.type === 'open_ended' && !answerFeedback.classList.contains('hidden')) {
                    // Self Grading
                    if (e.key === '1' || e.key.toLowerCase() === 'y' || e.key === 'ArrowLeft') {
                        e.preventDefault();
                        document.getElementById('self-correct-btn').click();
                    } else if (e.key === '2' || e.key.toLowerCase() === 'n' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        document.getElementById('self-wrong-btn').click();
                    }
                } else {
                    // Next Question (works for both MCQ and after Self Grading)
                    if (e.key === 'Enter' || e.key === ' ') {
                        if (e.key === ' ') e.preventDefault();
                        nextBtn.click();
                    }
                }
            }
        });

    </script>

    <!-- Quit Confirmation Modal -->
    <div id="quit-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white/70 backdrop-blur-2xl border border-gray-200/50 p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center border border-gray-100">
            <div class="text-red-500 mb-4 text-5xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2 font-outfit ">Quit Quiz?</h3>
            <p class="text-gray-500 mb-8">All your current progress will be lost. Are you sure you want to return to the dashboard?</p>
            <div class="flex flex-col space-y-3">
                <button id="confirm-quit-btn" class="btn-danger w-full py-3">Yes, Quit Quiz</button>
                <button id="cancel-quit-btn" class="btn-secondary w-full py-3">Cancel</button>
            </div>
        </div>
    </div>

</body>
</html>
