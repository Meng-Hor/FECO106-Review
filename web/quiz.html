        <!-- Quiz View -->
        <div id="quiz-view" class="hidden">
            <div class="card-container p-3 sm:p-6 mb-4 sm:mb-6 relative">
                <div class="flex flex-row justify-between items-center gap-2 mb-3 sm:mb-6 border-b pb-3 sm:pb-4">
                    <div>
                        <h3 id="current-set-title" class="text-sm sm:text-xl font-bold mb-0.5 sm:mb-1 font-outfit truncate max-w-[180px] sm:max-w-none">Set Title</h3>
                        <p class="text-sm text-gray-500">Question <span id="current-question-num">1</span> of <span id="total-questions">10</span></p>
                    </div>
                    <div class="flex items-center gap-4">
                        
                        <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-full border-4 border-blue-500 flex items-center justify-center relative transition-colors duration-300">

                <div class="mb-8">
                    <h2 id="question-text" class="text-base sm:text-xl font-semibold mb-3 sm:mb-6" style="color: var(--text-main)">Question text goes here?</h2>
                    
                    <div id="options-container" class="grid gap-2 sm:gap-4">
                        <!-- Options generated here -->

                    <div id="open-ended-container" class="hidden">
                        <textarea id="open-ended-answer" rows="3" class="w-full p-4 border rounded-lg focus:ring-2 focus:ring-blue-500 mb-4" placeholder="Type your answer here..."></textarea>

                        <div id="answer-feedback" class="hidden mt-6 p-5 card-container border rounded-xl">
                            <h4 class="font-bold mb-3">Model Answer:</h4>
                            <p id="model-answer-text" class="mb-5 leading-relaxed"></p>
                            <div class="flex gap-4 justify-center">
                                <button id="self-correct-btn" class="px-6 py-2 btn-success w-full sm:w-auto"><i class="fa-solid fa-check mr-2"></i>I Got It Right</button>
                                <button id="self-wrong-btn" class="px-6 py-2 btn-danger w-full sm:w-auto"><i class="fa-solid fa-xmark mr-2"></i>I Got It Wrong</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center mt-4 sm:mt-8 border-t pt-3 sm:pt-4">
                    <button id="quit-btn" class="btn-danger px-4 sm:px-6 py-2 sm:py-3"><i class="fa-solid fa-xmark mr-2"></i>Quit Quiz</button>
                    <button id="next-btn" class="btn-primary px-4 sm:px-6 py-2 sm:py-3 hidden">Next Question <i class="fa-solid fa-arrow-right ml-2"></i></button>
                </div>
            </div>
        </div>


        <!-- Result View -->
        <div id="result-view" class="hidden card-container p-6 sm:p-10 text-center relative overflow-hidden">
            <!-- Theme-adaptive ambient background glow -->
            <div class="absolute -top-20 -right-20 w-64 h-64 rounded-full blur-3xl opacity-20 pointer-events-none" style="background: var(--primary-color)"></div>
            <div class="absolute -bottom-20 -left-20 w-64 h-64 rounded-full blur-3xl opacity-10 pointer-events-none" style="background: var(--danger-color)"></div>
            
            <img id="completion-img" src="assets/gifs/success_1.gif" alt="Quiz Complete Celebration" class="w-32 sm:w-48 h-auto mx-auto mb-6 drop-shadow-xl rounded-2xl relative z-10 border-2 border-white/20 object-cover aspect-square">
            
            <h2 class="text-2xl sm:text-4xl font-extrabold mb-6 font-outfit theme-gradient-text tracking-tight relative z-10">Quiz Completed!</h2>
            
            <div class="grid grid-cols-2 gap-4 sm:gap-5 max-w-sm mx-auto mb-8 relative z-10">
                
                <!-- Correct Stat Card -->
                <div class="stat-card p-4 sm:p-5 rounded-xl flex flex-col items-center justify-center relative overflow-hidden group">
                    <div class="absolute inset-0 opacity-10 bg-gradient-to-br from-transparent to-[var(--success-color)] group-hover:opacity-20 transition-opacity duration-500"></div>
                    <i class="fa-solid fa-medal text-2xl sm:text-3xl mb-2 drop-shadow-md" style="color: var(--success-color)"></i>
                    <p class="text-xs sm:text-sm font-bold uppercase tracking-wider mb-2" style="color: var(--text-muted)">Correct</p>
                    <p id="correct-count" class="text-3xl sm:text-4xl font-black font-outfit drop-shadow-sm" style="color: var(--success-color)">0</p>
                </div>
                
                <!-- Incorrect Stat Card -->
                <div class="stat-card p-4 sm:p-5 rounded-xl flex flex-col items-center justify-center relative overflow-hidden group">
                    <div class="absolute inset-0 opacity-10 bg-gradient-to-br from-transparent to-[var(--danger-color)] group-hover:opacity-20 transition-opacity duration-500"></div>
                    <i class="fa-solid fa-circle-xmark text-2xl sm:text-3xl mb-2 drop-shadow-md" style="color: var(--danger-color)"></i>
                    <p class="text-xs sm:text-sm font-bold uppercase tracking-wider mb-2" style="color: var(--text-muted)">Incorrect</p>
                    <p id="incorrect-count" class="text-3xl sm:text-4xl font-black font-outfit drop-shadow-sm" style="color: var(--danger-color)">0</p>
                </div>
                
            </div>

            <button id="home-btn" class="btn-primary px-6 py-3 w-full max-w-xs mx-auto text-base rounded-xl relative z-10 shadow-lg transition-all"><i class="fa-solid fa-house mr-2"></i>Back to Dashboard</button>
        </div>

    <script>
        window.quizData = [];
    </script>

    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_2_State_Tracing/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_3_Defect_Diagnosis/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_4_Failure_and_Testing/data.js"></script>
    <script src="sets/Algorithm_III_Week_4_QuizGlow_Set_5_Integrated_Review/data.js"></script>
    <script src="sets/PDF_Set_1_follow-ups_Core_concepts/data.js"></script>
    <script src="sets/PDF_Set_2_follow-ups_State_tracing/data.js"></script>
    <script src="sets/PDF_Set_3_follow-ups_Defect_diagnosis/data.js"></script>
    <script src="sets/PDF_Set_4_follow-ups_Failure_and_testing/data.js"></script>
    <script src="sets/PDF_Set_5_follow-ups_Integrated_review/data.js"></script>
    <script src="sets/Revision_Exercise_1/data.js"></script>
    <script src="sets/Revision_Exercise_2/data.js"></script>

    <script>
    const pdfData = [{"name": "Revision Exercise 1.pdf", "path": "../material/Revision Exercise 1.pdf"}, {"name": "Revision Exercise 2.pdf", "path": "../material/Revision Exercise 2.pdf"}, {"name": "Set 1 follow-ups_ Core concepts.pdf", "path": "../material/Set 1 follow-ups_ Core concepts.pdf"}];

        const quizData = window.quizData;
        let currentSetIndex = -1;
        let currentQuestionIndex = 0;
        let score = 0;
        let correctAnswers = 0;
          let isGraded = false;
          let isAnswered = false;
        let timer;
        let timeLeft = 0;
        let dashboard = null;
        const quizView = document.getElementById('quiz-view');
        const resultView = document.getElementById('result-view');
        
        
        
        const setTitle = document.getElementById('current-set-title');
        const qNum = document.getElementById('current-question-num');
        const totalQ = document.getElementById('total-questions');
                const timeEl = document.getElementById('time-left');
        const qText = document.getElementById('question-text');
        
        const optionsContainer = document.getElementById('options-container');
        const openEndedContainer = document.getElementById('open-ended-container');
        const oeAnswer = document.getElementById('open-ended-answer');
        const revealBtn = document.getElementById('reveal-btn');
        const answerFeedback = document.getElementById('answer-feedback');
        const modelAnswerText = document.getElementById('model-answer-text');
        
        const nextBtn = document.getElementById('next-btn');
        const quitBtn = document.getElementById('quit-btn');
        
        
        
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }





                window.addEventListener('DOMContentLoaded', () => {
        const quitBtnObj = document.getElementById('quit-btn');
        const quitModal = document.getElementById('quit-modal');
        const confirmQuitBtn = document.getElementById('confirm-quit-btn');
        const cancelQuitBtn = document.getElementById('cancel-quit-btn');
        
        if (quitBtnObj && quitModal) {
// Intercept Navbar links to show Quit Modal
        const navLinks = document.querySelectorAll('nav a');
        navLinks.forEach(link => {
            link.onclick = (e) => {
                e.preventDefault();
                const targetHref = link.getAttribute('href');
                clearInterval(timer);
                quitModal.classList.remove('hidden');
                
                // Temporarily override the confirm button to go to their clicked nav link
                confirmQuitBtn.onclick = () => {
                    window.location.href = targetHref;
                };
            };
        });
        
        // Reset confirm button behavior for the regular Quit Quiz button
        if (quitBtnObj) {
            quitBtnObj.onclick = () => {
                clearInterval(timer);
                quitModal.classList.remove('hidden');
                
                confirmQuitBtn.onclick = () => {
                    window.location.href = 'index.html';
                };
            };
        }
            
            confirmQuitBtn.onclick = () => {
                window.location.href = 'index.html';
            };
            
            cancelQuitBtn.onclick = () => {
                quitModal.classList.add('hidden');
                if(!isAnswered) if (timer) clearInterval(timer);
            timer = setInterval(updateTimer, 1000);
            };
        }

            const params = new URLSearchParams(window.location.search);
            const setIndex = params.get('set');
      const parsedIndex = parseInt(setIndex, 10);
      if (setIndex !== null && !Number.isNaN(parsedIndex) && parsedIndex >= 0 && parsedIndex < quizData.length && quizData[parsedIndex]) {
                dashboard = { classList: { add: ()=>{}, remove: ()=>{} } };
                startQuiz(parseInt(setIndex));
            } else {
                window.location.href = 'index.html'; // Redirect back if no valid set
            }
        });
function startQuiz(index) {
            if (timer) clearInterval(timer);
            currentSetIndex = index;
            currentQuestionIndex = 0;
            score = 0;
            correctAnswers = 0;
            
            resultView.classList.add('hidden');
            quizView.classList.remove('hidden');
            
            
            setTitle.textContent = quizData[currentSetIndex].set.replace(/_/g, ' ');

            totalQ.textContent = quizData[currentSetIndex].questions.length;
            
            loadQuestion();
        }

        function loadQuestion() {
            isGraded = false;
            isAnswered = false;
            nextBtn.classList.add("hidden");
            nextBtn.disabled = false;
            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            isAnswered = false;
            
            qNum.textContent = currentQuestionIndex + 1;
            
            
            // Strip hardcoded inline styles and inject syntax highlighting classes
            let qHTML = q.question;
            qHTML = qHTML.replace(/<pre style="[^"]*">/g, '<pre class="quiz-code-block">');
            qHTML = qHTML.replace(/<code>/g, '<code class="language-cpp">');
            
            qText.innerHTML = qHTML;
            
            // Trigger Highlight.js on the newly injected code blocks
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            
            timeLeft = parseInt(q.timeLimit) || 30;
            timeEl.textContent = timeLeft;
            timeEl.parentElement.style.borderColor = 'var(--primary-color)';
            timeEl.style.color = 'var(--primary-color)';
            
            clearInterval(timer);
            if (timer) clearInterval(timer);
            timer = setInterval(updateTimer, 1000);
            
            if (q.type === 'open_ended') {
                optionsContainer.classList.add('hidden');
                openEndedContainer.classList.remove('hidden');
                oeAnswer.value = '';
                oeAnswer.disabled = false;
                revealBtn.classList.remove('hidden');
                answerFeedback.classList.add('hidden');
            } else {
                openEndedContainer.classList.add('hidden');
                optionsContainer.classList.remove('hidden');
                optionsContainer.innerHTML = '';
                const borderClasses = ['opt-1', 'opt-2', 'opt-3', 'opt-4'];
                
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `option-btn w-full p-3 sm:p-4 text-left font-medium rounded-lg flex items-center ${borderClasses[idx]}`;
                    btn.innerHTML = `<span class="option-badge mr-3 font-bold px-3 py-1 rounded-md shadow-sm backdrop-blur-sm">${idx + 1}</span> <span>${escapeHtml(opt)}</span>`;
                    btn.onclick = () => selectOption(idx + 1, btn);
                    optionsContainer.appendChild(btn);
                });
            }
            
            nextBtn.classList.add('hidden');
        }
        
        function updateTimer() {
            timeLeft--;
            timeEl.textContent = timeLeft;
            
            if (timeLeft <= 5) {
                
                timeEl.parentElement.style.borderColor = 'var(--danger-color)'; timeEl.style.color = 'var(--danger-color)';
            }
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                if (quizData[currentSetIndex].questions[currentQuestionIndex].type === 'open_ended') {
                    showModelAnswer();
                } else {
                    timeOutMCQ();
                }
            }
        }

        // Open Ended Logic
        revealBtn.onclick = () => {
            clearInterval(timer);
            showModelAnswer();
        };

        function showModelAnswer() {
              if(isAnswered) return;
              isAnswered = true;
            isAnswered = true;
            oeAnswer.disabled = true;
            revealBtn.classList.add('hidden');
            
            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            modelAnswerText.textContent = q.correctAnswer;
            answerFeedback.classList.remove('hidden');
        }

        document.getElementById('self-correct-btn').onclick = () => {
              if(isGraded) return;
              isGraded = true;
            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            correctAnswers++;
            
            answerFeedback.classList.add('hidden');
            nextBtn.click();
        };

        document.getElementById('self-wrong-btn').onclick = () => {
              if(isGraded) return;
              isGraded = true;
            answerFeedback.classList.add('hidden');
            nextBtn.click();
        };
        
        // MCQ Logic
        function timeOutMCQ() {
            if (isAnswered) return;
            isAnswered = true;
            
            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            const correctIdx = q.correctOption - 1;
            
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === correctIdx) {
                    buttons[i].classList.add('correct');
                } else {
                    buttons[i].classList.add('opacity-50');
                }
            }
            
            nextBtn.classList.remove('hidden');
        }
        
        function selectOption(selectedOpt, btnElement) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timer);
            
            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            const correctOpt = Number(q.correctOption);
                        
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i + 1 === correctOpt) {
                    buttons[i].classList.add('correct');
                } else {
                    buttons[i].classList.add('opacity-50');
                }
            }
            
            if (selectedOpt === correctOpt) {
                correctAnswers++;
            } else {
                btnElement.classList.remove('opacity-50');
                btnElement.classList.add('incorrect');
            }
            
            nextBtn.classList.remove('hidden');
        }
        
        nextBtn.onclick = () => {
              if(nextBtn.disabled) return;
              nextBtn.disabled = true;
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData[currentSetIndex].questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };
        
        
        
        function showResults() {
              if(timer) clearInterval(timer);
            quizView.classList.add('hidden');
            resultView.classList.remove('hidden');
            
            // Randomly select one of the success GIFs
            const availableGifs = ['assets/gifs/amazed_mind_blown.gif', 'assets/gifs/nice_borat.gif', 'assets/gifs/nice_key_and_peele.gif', 'assets/gifs/nice_michael_rosen.gif', 'assets/gifs/goodjob_koolaid_man.gif', 'assets/gifs/goodjob_thumbs_up.gif', 'assets/gifs/goodjob_spongebob.gif', 'assets/gifs/goodjob_office.gif', 'assets/gifs/very_nice_borat.gif', 'assets/gifs/cool_kitty_sunglasses.gif', 'assets/gifs/reaction_user_added_1.gif', 'assets/gifs/reaction_user_added_2.gif', 'assets/gifs/reaction_user_added_3.gif', 'assets/gifs/reaction_user_added_4.gif', 'assets/gifs/reaction_user_added_5.gif'];
            const randomGifPath = availableGifs[Math.floor(Math.random() * availableGifs.length)];
            document.getElementById('completion-img').src = randomGifPath;
            
            
            document.getElementById('correct-count').textContent = correctAnswers;
            const total = quizData[currentSetIndex].questions.length;
            document.getElementById('incorrect-count').textContent = total - correctAnswers;
        }
        
        
        
        document.getElementById('home-btn').onclick = () => window.location.href = 'index.html';
        
        

        // --- KEYBOARD INTERACTIVITY ---
        document.addEventListener('keydown', (e) => {
            // Ignore if we are in the dashboard or result view
            if (quizView.classList.contains('hidden')) return;

            const q = quizData[currentSetIndex].questions[currentQuestionIndex];
            const isTyping = document.activeElement === oeAnswer;

            if (!isAnswered) {
                if (q.type === 'open_ended') {
                    // Submit Answer
                    if (isTyping && e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        revealBtn.click();
                    }
                } else {
                    // MCQ Selection
                    if (['1', '2', '3', '4'].includes(e.key)) {
                        e.preventDefault();
                        const idx = parseInt(e.key) - 1;
                        const btns = optionsContainer.querySelectorAll('.option-btn');
                        if (btns[idx]) btns[idx].click();
                    }
                }
            } else {
                // Answered State
                if (q.type === 'open_ended' && !answerFeedback.classList.contains('hidden')) {
                    // Self Grading
                    if (e.key === '1' || e.key.toLowerCase() === 'y' || e.key === 'ArrowLeft') {
                        e.preventDefault();
                        document.getElementById('self-correct-btn').click();
                    } else if (e.key === '2' || e.key.toLowerCase() === 'n' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        document.getElementById('self-wrong-btn').click();
                    }
                } else {
                    // Next Question (works for both MCQ and after Self Grading)
                    if (e.key === 'Enter' || e.key === ' ') {
                        if (e.key === ' ') e.preventDefault();
                        nextBtn.click();
                    }
                }
            }
        });

    </script>

    <!-- Quit Confirmation Modal -->
    <div id="quit-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center backdrop-blur-md transition-opacity">
        <div class="card-container p-6 sm:p-8 max-w-sm w-full mx-4 text-center">
            <div class="mb-5 text-5xl" style="color: var(--danger-color)">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-xl sm:text-2xl font-bold mb-3 font-outfit style="color: var(--text-main)"">Quit Quiz?</h3>
            <p class="mb-8 leading-relaxed font-medium">All your current progress will be lost. Are you sure you want to return to the dashboard?</p>
            <div class="flex flex-col space-y-3">
                <button id="confirm-quit-btn" class="btn-danger px-4 sm:px-6 py-2 sm:py-3 w-full font-bold">Yes, Quit Quiz</button>
                <button id="cancel-quit-btn" class="btn-secondary px-4 sm:px-6 py-2 sm:py-3 w-full font-bold">Cancel</button>
            </div>
        </div>
    </div>


    <script>
        // Theme & Mode Logic
        const themeSelector = document.getElementById('theme-selector');
        const modeToggle = document.getElementById('mode-toggle');
        const modeIcon = document.getElementById('mode-icon');
        
        // Load saved theme
        const savedTheme = localStorage.getItem('selectedTheme') || 'aura';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (themeSelector) themeSelector.value = savedTheme;

        // Load saved mode or default strictly to light
        let currentMode = localStorage.getItem('colorMode') || 'light';
        document.documentElement.setAttribute('data-color-mode', currentMode);
        updateModeIcon();

        // Listen for Theme changes
        if (themeSelector) {
            themeSelector.addEventListener('change', (e) => {
                const newTheme = e.target.value;
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('selectedTheme', newTheme);
            });
        }
        
        // Listen for Mode changes
        if (modeToggle) {
            modeToggle.addEventListener('click', () => {
                currentMode = currentMode === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-color-mode', currentMode);
                localStorage.setItem('colorMode', currentMode);
                updateModeIcon();
            });
        }

        function updateModeIcon() {
            if (modeIcon) {
                if (currentMode === 'dark') {
                    modeIcon.className = 'fa-solid fa-sun';
                } else {
                    modeIcon.className = 'fa-solid fa-moon';
                }
            }
        }
    </script>

    <script>
        // Smart Header Logic - 300px Threshold & Top Hover Reveal
        let lastScrollY = window.scrollY;
        let scrollUpDistance = 0;
        let ticking = false;
        let isHoveringTop = false;
        
        const header = document.getElementById('smart-header');
        
        function showHeader() {
            header.style.transform = 'translateY(0)';
            header.style.opacity = '1';
            header.style.pointerEvents = 'auto';
        }

        function hideHeader() {
            if (window.scrollY > 100 && !isHoveringTop) {
                header.style.transform = 'translateY(-120%)';
                header.style.opacity = '0';
                header.style.pointerEvents = 'none';
            }
        }

        // 1. Mouse hover logic for desktop
        document.addEventListener('mousemove', (e) => {
            if (e.clientY < 90) {
                if (!isHoveringTop) {
                    isHoveringTop = true;
                    showHeader();
                }
            } else {
                if (isHoveringTop) {
                    isHoveringTop = false;
                    // Hide if we move mouse away, UNLESS we earned the header by scrolling up 300px
                    if (scrollUpDistance < 300 && window.scrollY > 100) {
                        hideHeader();
                    }
                }
            }
        });

        // 2. Scroll logic
        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    const currentScrollY = window.scrollY;
                    const scrollDelta = currentScrollY - lastScrollY;
                    
                    if (scrollDelta > 0) {
                        // Scrolling DOWN
                        scrollUpDistance = 0; // Reset up-scroll counter
                        hideHeader();
                    } else if (scrollDelta < 0) {
                        // Scrolling UP
                        scrollUpDistance += Math.abs(scrollDelta);
                        
                        // Reveal if scrolled up intentionally by 300px, or near top
                        if (scrollUpDistance > 300 || currentScrollY < 100) {
                            showHeader();
                        }
                    }
                    
                    lastScrollY = currentScrollY;
                    ticking = false;
                });
                ticking = true;
            }
        }, { passive: true });
    </script>

  <script>
    // Mobile Hamburger Menu Toggle
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const hamburgerIcon = document.getElementById('hamburger-icon');
    if (mobileMenuBtn && mobileMenu) {
      mobileMenuBtn.addEventListener('click', () => {
        const isOpen = !mobileMenu.classList.contains('hidden');
        mobileMenu.classList.toggle('hidden');
        hamburgerIcon.className = isOpen ? 'fa-solid fa-bars text-sm' : 'fa-solid fa-xmark text-sm';
      });
      // Close menu on link click
      mobileMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          mobileMenu.classList.add('hidden');
          hamburgerIcon.className = 'fa-solid fa-bars text-sm';
        });
      });
    }
  </script>
</body>
